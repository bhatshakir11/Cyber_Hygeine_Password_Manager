<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cyber Hygiene Autofill Unlock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg0: #02060d;
        --bg1: #07111e;
        --panel: rgba(11, 17, 28, 0.96);
        --border: rgba(0, 181, 216, 0.34);
        --text: #e6edf3;
        --muted: #a9b3c1;
        --cyan: #00b5d8;
        --mint: #14f1d9;
        --danger: #ff5d7a;
        --ok: #1dd1a1;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 18px;
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(120% 100% at 15% 0%, rgba(0, 181, 216, 0.18), transparent 42%),
          linear-gradient(145deg, var(--bg0), var(--bg1));
      }

      .card {
        width: min(100%, 460px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.32);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        font-weight: 800;
        background: linear-gradient(90deg, var(--mint), var(--cyan));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.5;
      }

      .status {
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 14px;
        border: 1px solid transparent;
      }

      .status.info {
        color: #c8e8f8;
        background: rgba(2, 132, 199, 0.14);
        border-color: rgba(2, 132, 199, 0.38);
      }

      .status.success {
        color: #d6ffef;
        background: rgba(29, 209, 161, 0.13);
        border-color: rgba(29, 209, 161, 0.38);
      }

      .status.error {
        color: #ffe6ee;
        background: rgba(255, 93, 122, 0.13);
        border-color: rgba(255, 93, 122, 0.38);
      }

      .meta {
        margin-bottom: 16px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .meta strong {
        display: block;
        margin-bottom: 6px;
      }

      .actions {
        display: grid;
        gap: 10px;
      }

      button {
        width: 100%;
        border: 1px solid transparent;
        border-radius: 12px;
        padding: 12px 14px;
        cursor: pointer;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }

      .primary {
        background: linear-gradient(90deg, #0079b8, #00b5d8);
      }

      .secondary {
        background: linear-gradient(90deg, #233145, #1d2b3c);
        border-color: rgba(0, 181, 216, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Autofill Unlock</h1>
      <p>Confirm your extension fingerprint to autofill the selected account.</p>
      <div id="status" class="status info">Preparing autofill...</div>
      <div class="meta">
        <strong id="domainLabel">Domain: -</strong>
        <span id="accountLabel">Account: -</span>
      </div>
      <div class="actions">
        <button id="retryBtn" class="primary">Try Again</button>
        <button id="closeBtn" class="secondary">Close</button>
      </div>
    </div>

    <script src="autofill-auth.js"></script>
  </body>
</html>
